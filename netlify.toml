# NishCloudPhone on Netlify - the same Next.js app that runs on Vercel.
# The Next.js runtime plugin is required: without it Netlify serves the
# site as static files and every API route (login, phones, creation)
# breaks. Env vars (database + server keys) are set in the Netlify
# dashboard under Site configuration > Environment variables - they are
# never committed to the repo.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
