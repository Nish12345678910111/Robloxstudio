name: Cloud Phone

# CLOUD PHONE - separate workflow. RDP (main.yml) is untouched.
# Android in QEMU -> noVNC -> random Cloudflare Quick Tunnel URL + VNC password.
# The tunnel URL/password are uploaded as a PRIVATE Actions artifact
# (cloud-phone-info.json) so the NishCloudPhone dashboard can fetch them
# server-side with a token. They are never committed to this public repo.
#
# GitHub hard limit: a job can run at most 360 minutes (~6h). Nothing can
# run "forever" on GitHub Actions - when a run ends, just start a new phone.

run-name: "Cloud Phone ${{ inputs.phone_id }}"

on:
  workflow_dispatch:
    inputs:
      phone_id:
        description: "Phone ID (set automatically by the dashboard)"
        required: false
        default: "manual"
        type: string
      edition:
        description: "Android edition"
        required: true
        default: "android11"
        type: choice
        options: ["android11", "android9"]
      session_minutes:
        description: "Keep-alive minutes (max 355; GitHub kills jobs at ~360)"
        required: true
        default: "340"
        type: choice
        options: ["30", "60", "120", "240", "300", "340", "355"]
      ram_mb:
        description: "Phone RAM (MB) - runner has 16 GB total"
        required: true
        default: "12288"
        type: choice
        options: ["4096", "8192", "12288"]
      cpu_cores:
        description: "Phone CPU cores - runner has 4 vCPUs"
        required: true
        default: "4"
        type: choice
        options: ["2", "4"]
      disk_gb:
        description: "Phone storage (GB)"
        required: true
        default: "32"
        type: choice
        options: ["16", "32"]

permissions:
  contents: read

# NOTE: no concurrency group on purpose - every dispatch gets its own
# runner, so you can create MULTIPLE cloud phones at the same time.

jobs:
  cloud-phone:
    name: Cloud Phone
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU, noVNC and tools (max performance setup)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils \
            novnc websockify \
            socat curl ca-certificates adb xorriso cpio aria2 ffmpeg
          # /dev/kvm exists but is root:kvm 0660 - make it writable so QEMU
          # gets real hardware acceleration instead of slow TCG emulation.
          sudo chmod 666 /dev/kvm || true
          if [ -w /dev/kvm ]; then echo "KVM: READY (hardware acceleration)"; else echo "KVM: not writable, TCG fallback"; fi
          nproc; free -h

      - name: Install cloudflared (Cloudflare Tunnel)
        run: |
          curl -fL --retry 3 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Cache Android ISO
        uses: actions/cache@v4
        with:
          path: |
            .phone-vm/android-x86.iso
            .phone-vm/android-x86-phone.iso
            .phone-vm/bliss11.iso
            .phone-vm/bliss11-phone.iso
          key: cloud-phone-android-x86-iso-v2

      - name: Cache Bliss OS Android 11 ISO
        uses: actions/cache@v4
        with:
          path: |
            .phone-vm/bliss11.iso
            .phone-vm/bliss11-phone.iso
          key: cloud-phone-bliss11-iso-v1

      - name: Start Cloud Phone (QEMU + noVNC + Cloudflare tunnel)
        env:
          PHONE_ID: ${{ inputs.phone_id }}
          START_ONLY: "1"
          PHONE_INFO_FILE: ${{ github.workspace }}/cloud-phone-info.json
          RAM_MB: ${{ inputs.ram_mb }}
          CPU_CORES: ${{ inputs.cpu_cores }}
          DISK_GB: ${{ inputs.disk_gb }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          EDITION: ${{ inputs.edition }}
        run: |
          chmod +x scripts/mobile-phone/start.sh
          ./scripts/mobile-phone/start.sh
          echo "--- phone info (password redacted in log) ---"
          sed 's/"password":"[^"]*"/"password":"********"/' cloud-phone-info.json

      - name: Save Android ISO to cache NOW (not at job end)
        continue-on-error: true
        # actions/cache normally saves in post-job, which never happens when
        # a 340-min session is cancelled - that is why every run re-downloaded
        # 921 MB. Saving explicitly here makes the NEXT phone start fast.
        uses: actions/cache/save@v4
        with:
          path: |
            .phone-vm/android-x86.iso
            .phone-vm/android-x86-phone.iso
            .phone-vm/bliss11.iso
            .phone-vm/bliss11-phone.iso
          key: cloud-phone-android-x86-iso-v2

      - name: Publish phone info for the dashboard (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cloud-phone-info-${{ inputs.phone_id }}-${{ github.run_id }}
          path: cloud-phone-info.json
          retention-days: 1
          if-no-files-found: error

      - name: Keep phone alive (until session ends or run is cancelled)
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
        run: |
          echo "Phone is LIVE. Keeping it alive for ${SESSION_MINUTES} minutes (GitHub max ~360)."
          echo "Stop it any time from the NishCloudPhone dashboard or by cancelling this run."
          DEADLINE=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if [ -f .phone-vm/qemu.pid ] && ! kill -0 "$(cat .phone-vm/qemu.pid)" 2>/dev/null; then
              echo "::error::QEMU died early"; tail -n 50 .phone-vm/websockify.log .phone-vm/cloudflared.log || true; exit 1
            fi
            sleep 60
          done
          echo "Session over."
