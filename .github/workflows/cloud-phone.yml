name: Cloud Phone

# CLOUD PHONE - separate workflow. RDP (main.yml) is untouched.
# Android 11/15 x86_64 use the Linux x86_64 runner. The optional Android 15
# ARM64 guest uses a Linux ARM64 runner so its system image matches the host.
# The phone's URL/password are stored only in the owner's account database row
# (via AIVEN_DATABASE_URL); they are never printed, uploaded, or committed.
#
# A job can run at most 360 minutes (~6h). Nothing can run "forever" -
# when a run ends, just start a new phone.

run-name: "Cloud Phone ${{ inputs.phone_id }}"

on:
  workflow_dispatch:
    inputs:
      phone_id:
        description: "Phone ID (set automatically by the dashboard)"
        required: false
        default: "manual"
        type: string
      edition:
        description: "Android edition (ARM64 guest uses a hosted ARM64 runner; experimental)"
        required: true
        default: "android11"
        type: choice
        options: ["android11", "android15", "android15-arm64"]
      session_minutes:
        description: "Keep-alive minutes (max 355; GitHub kills jobs at ~360)"
        required: true
        default: "340"
        type: choice
        options: ["30", "60", "120", "240", "300", "340", "355"]
      ram_mb:
        description: "Phone RAM (MB) - runner has 16 GB total"
        required: true
        default: "12288"
        type: choice
        options: ["4096", "8192", "12288"]
      cpu_cores:
        description: "Phone CPU cores - runner has 4 vCPUs"
        required: true
        default: "4"
        type: choice
        options: ["2", "4"]
      disk_gb:
        description: "Phone storage (GB)"
        required: true
        default: "32"
        type: choice
        options: ["16", "32"]

permissions:
  contents: read

# NOTE: no concurrency group on purpose - every dispatch gets its own
# runner, so you can create MULTIPLE cloud phones at the same time.

jobs:
  cloud-phone:
    name: Cloud Phone
    runs-on: ${{ inputs.edition == 'android15-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable hardware acceleration
        run: |
          # Give the Android Emulator real hardware acceleration (KVM).
          # Without a writable /dev/kvm the emulator refuses to start and
          # the phone screen stays black - this is the standard fix.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
          if [ -w /dev/kvm ]; then echo "Acceleration: READY"; else echo "Acceleration: software mode"; fi
          echo "Host architecture: $(uname -m)"
          nproc; free -h

      - name: Cache cloudflared binary
        uses: actions/cache@v4
        with:
          path: ~/cloudflared-bin
          key: cloudflared-bin-v2-${{ runner.arch }}

      - name: Install cloudflared (Cloudflare Tunnel)
        run: |
          case "$(uname -m)" in
            x86_64) CLOUDFLARED_ARCH=amd64 ;;
            aarch64|arm64) CLOUDFLARED_ARCH=arm64 ;;
            *) echo "Unsupported Cloud Phone host architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          if [ -x ~/cloudflared-bin/cloudflared ]; then
            cp ~/cloudflared-bin/cloudflared /tmp/cloudflared
          else
            for i in 1 2 3 4 5; do
              curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o /tmp/cloudflared \
                "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-${CLOUDFLARED_ARCH}" && break
              echo "cloudflared download attempt $i failed, retrying..."; sleep 10
            done
            mkdir -p ~/cloudflared-bin && cp /tmp/cloudflared ~/cloudflared-bin/cloudflared || true
          fi
          test -s /tmp/cloudflared
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start screen service (live Url first)
        env:
          PHONE_ID: ${{ inputs.phone_id }}
          PHASE: "1"
          EDITION: ${{ inputs.edition }}
          ANDROID_SDK_ROOT: ${{ inputs.edition == 'android15-arm64' && format('{0}/.phone-vm/sdk', github.workspace) || '/usr/local/lib/android/sdk' }}
          AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
        run: |
          chmod +x scripts/mobile-phone/start.sh
          ./scripts/mobile-phone/start.sh

      - name: Cache Android Emulator (SDK + phone image)
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/cmdline-tools
            .phone-vm/sdk/emulator
            .phone-vm/sdk/system-images
            .phone-vm/sdk/platform-tools
            .phone-vm/sdk/cmdline-tools
          key: cloud-phone-emulator-v7-${{ inputs.edition }}

      - name: Start Cloud Phone
        id: start_phone
        env:
          PHONE_ID: ${{ inputs.phone_id }}
          PHASE: "2"
          START_ONLY: "1"
          RAM_MB: ${{ inputs.ram_mb }}
          CPU_CORES: ${{ inputs.cpu_cores }}
          DISK_GB: ${{ inputs.disk_gb }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          EDITION: ${{ inputs.edition }}
          ANDROID_SDK_ROOT: ${{ inputs.edition == 'android15-arm64' && format('{0}/.phone-vm/sdk', github.workspace) || '/usr/local/lib/android/sdk' }}
          AIVEN_DATABASE_URL: ${{ secrets.AIVEN_DATABASE_URL }}
        run: |
          chmod +x scripts/mobile-phone/start.sh
          ./scripts/mobile-phone/start.sh

      - name: Report safe Android startup diagnostics
        if: ${{ failure() && steps.start_phone.outcome == 'failure' }}
        env:
          PHONE_WORKDIR: ${{ github.workspace }}/.phone-vm
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PHONE_WORKDIR"])
          names = ("sdkmanager.log", "emulator.log", "setup-skip.log", "scrcpy.log")
          interesting = ("error", "failed", "not found", "unsupported", "warning", "unable", "could not", "did not", "timed out", "timeout", "fatal", "exception", "boot", "image", "accel", "kvm", "qemu", "emulator", "scrcpy")
          sensitive = ("password", "token", "secret", "aiven_database_url", "trycloudflare.com", "http://", "https://")
          found = False
          for name in names:
              path = root / name
              if not path.is_file():
                  continue
              lines = path.read_text(errors="replace").splitlines()
              selected = [line for line in lines[-150:] if any(word in line.lower() for word in interesting)] or lines[-8:]
              for line in selected[-20:]:
                  if any(word in line.lower() for word in sensitive):
                      continue
                  safe = line[:500].replace("%", "%25").replace(":", "%3A").replace(",", "%2C")
                  print(f"::error title=Cloud Phone startup ({name})::{safe}")
                  found = True
          if not found:
              print("::error title=Cloud Phone startup::No safe emulator diagnostics were written.")
          PY

      - name: Save Android Emulator to cache (including after a startup failure)
        if: always() && steps.start_phone.outputs.sdk_cache_ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images
            /usr/local/lib/android/sdk/platform-tools
            /usr/local/lib/android/sdk/cmdline-tools
            .phone-vm/sdk/emulator
            .phone-vm/sdk/system-images
            .phone-vm/sdk/platform-tools
            .phone-vm/sdk/cmdline-tools
          key: cloud-phone-emulator-v7-${{ inputs.edition }}

      - name: Keep phone alive (until session ends or run is cancelled)
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          PHONE_ID: ${{ inputs.phone_id }}
        run: |
          echo "Cloud phone created."
          echo "Keeping it alive for ${SESSION_MINUTES} minutes."
          DEADLINE=$(( $(date +%s) + SESSION_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            # Deletion queue: ask the website (signed, per-phone secret)
            # whether this phone was deleted/stopped by its owner.
            if [ -f .phone-vm/.pw ]; then
              PT="$(printf %s "$(cat .phone-vm/.pw)" | sha256sum | cut -d' ' -f1)"
              if curl -fs --max-time 10 -H "x-phone-token: $PT" "https://nishproductions.pages.dev/api/phone-directive?id=${PHONE_ID}" 2>/dev/null | grep -q '"action":"stop"'; then
                echo "Owner deleted this phone - shutting down."
                exit 0
              fi
            fi
            if [ ! -f .phone-vm/scrcpy.pid ] || ! kill -0 "$(cat .phone-vm/scrcpy.pid)" 2>/dev/null; then
              echo "phone screen mirror stopped"; exit 1
            fi
            if [ -f .phone-vm/emulator.pid ] && ! kill -0 "$(cat .phone-vm/emulator.pid)" 2>/dev/null; then
              DEAD=$(( ${DEAD:-0} + 1 ))
              # 3 consecutive dead checks (~45s) before declaring it gone -
              # a slow-starting phone must never be reported as an error.
              if [ "$DEAD" -ge 3 ]; then echo "phone stopped"; exit 1; fi
            else DEAD=0; fi
            sleep 15
          done
          echo "Session over."

