name: 📱 Mobile Phone (QEMU + noVNC + Cloudflare)

# Boots an Android phone inside QEMU on the runner, serves its screen with
# noVNC, and publishes it through a random Cloudflare Quick Tunnel URL.
# Open the URL printed in the run logs / summary, click Connect, and enter
# the generated VNC password. No Cloudflare account, token, Tailscale, or
# inbound port is needed - the tunnel is outbound-only and the URL is
# randomly generated by Cloudflare on every run.
#
# Your existing Windows RDP workflow (.github/workflows/main.yml) is
# untouched; this is a separate, manually-triggered workflow.

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: "VNC password (leave empty = random 8-char password is generated & printed in the logs)"
        required: false
        default: ""
        type: string
      session_minutes:
        description: "How long to keep the phone online (GitHub max job time is ~360 min)"
        required: true
        default: "300"
        type: choice
        options: ["30", "60", "120", "240", "300", "340"]
      ram_mb:
        description: "Phone RAM (MB)"
        required: true
        default: "4096"
        type: choice
        options: ["2048", "4096", "6144", "8192"]
      cpu_cores:
        description: "Phone CPU cores"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "4"]
      disk_gb:
        description: "Phone internal storage (GB, qcow2 - only used space counts)"
        required: true
        default: "16"
        type: choice
        options: ["8", "16", "32"]
      android_iso_url:
        description: "Android-x86 ISO URL (advanced - leave default unless you have a mirror)"
        required: false
        default: "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download"
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-phone-qemu
  cancel-in-progress: false

jobs:
  phone:
    name: Android phone via QEMU + noVNC
    runs-on: ubuntu-latest
    # GitHub-hosted jobs hard-cap at 360 minutes.
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU, noVNC and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils \
            novnc websockify \
            socat curl ca-certificates adb xorriso cpio aria2 cpu-checker
          echo "--- KVM check (acceleration is optional, TCG fallback exists) ---"
          ls -l /dev/kvm || echo "no /dev/kvm on this runner - TCG emulation will be used"
          kvm-ok || true

      - name: Install cloudflared (Cloudflare Tunnel client)
        run: |
          curl -fL --retry 3 \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          sudo mv /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Cache Android ISO (so re-runs don't re-download ~900 MB)
        uses: actions/cache@v4
        with:
          path: .phone-vm/android-x86.iso
          key: android-x86-iso-${{ hashFiles('.github/workflows/mobile-phone-qemu-novnc.yml') }}-${{ inputs.android_iso_url }}

      - name: 📱 Boot phone + start noVNC + open Cloudflare tunnel
        env:
          VNC_PASSWORD: ${{ inputs.vnc_password }}
          ANDROID_ISO_URL: ${{ inputs.android_iso_url }}
          RAM_MB: ${{ inputs.ram_mb }}
          CPU_CORES: ${{ inputs.cpu_cores }}
          DISK_GB: ${{ inputs.disk_gb }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
        run: |
          chmod +x scripts/mobile-phone/start.sh
          # NOTE: this step intentionally runs for the whole session -
          # the phone is alive as long as this step is running. Cancel
          # the workflow run to switch the phone off.
          ./scripts/mobile-phone/start.sh
